<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Buscador de Precios - Lab</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #e0e0e0; padding: 40px; }
        .container { max-width: 600px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        input[type="text"] { width: 70%; padding: 10px; font-size: 16px; background: #2d2d2d; border: 1px solid #444; color: #fff; border-radius: 4px; }
        button { padding: 10px 20px; font-size: 16px; background: #007acc; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #005999; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; }
        th, td { padding: 12px; border-bottom: 1px solid #333; text-align: left; }
        th { background: #252526; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Buscador de Precios (Laboratorio)</h2>
        <form method="GET" action="/">
            <input type="text" name="q" value="{{ busqueda }}" placeholder="Busca un producto...">
            <button type="submit">Buscar</button>
        </form>

        <table>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Precio ($)</th>
                <th>Stock</th>
            </tr>
            {% for p in productos %}
            <tr>
                <td>{{ p[0] }}</td>
                <td>{{ p[1] }}</td>
                <td>${{ p[2] }}</td>
                <td>{{ p[3] }}</td>
            </tr>
            {% else %}
            <tr>
                <td colspan="4" style="text-align: center;">No se encontraron productos.</td>
            </tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
